name: Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK with Buildozer
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BUILDOZER_VERSION: "1.5.0"
      CYTHON_VERSION: "0.29.36"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache Buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 libltdl-dev \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==${BUILDOZER_VERSION}" "cython==${CYTHON_VERSION}"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer-build.log

      - name: Verify APK output
        shell: bash
        run: ls -lh bin/*.apk

      - name: Summarize result
        if: always()
        shell: bash
        run: |
          {
            echo "## Android debug APK"
            echo
            if ls bin/*.apk >/dev/null 2>&1; then
              echo "APK produced:"
              echo '```'
              ls -lh bin/*.apk
              echo '```'
            else
              echo "No APK was produced. The full Buildozer log is in the workflow artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debtmanagerpro-debug-apk
          path: |
            bin/*.apk
            buildozer-build.log
          if-no-files-found: warn
          retention-days: 14
